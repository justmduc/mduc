<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Jackson Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<table class="main-container" align="center" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">
            <table class="logo-box" cellspacing="0" cellpadding="0">
                <tr><td class="logo-top" align="center"><b>Jackson</b></td></tr>
                <tr><td class="logo-bottom" align="center"><b>Electronics</b></td></tr>
            </table>
            <h2 class="title">Registration Form</h2>

            <form>
                <table class="form-table" border="0" cellspacing="2" cellpadding="2">
                    <tr>
                        <td class="sub" colspan="4" align="center">Register your Jackson Electronics product here</td>
                    </tr>
                    <tr>
                        <td class="label">First Name:</td>
                        <td colspan="3">
                            <input type="text" size="13"><span class="label-inline">Last Name:</span><input type="text" size="13">
                        </td>
                    </tr>
                    <tr>
                        <td class="label">Address #1:</td>
                        <td colspan="3"><input type="text" size="24"></td>
                    </tr>
                    <tr>
                        <td class="label">Address #2:</td>
                        <td colspan="3"><input type="text" size="24"></td>
                    </tr>
                    <tr>
                        <td class="label">City:</td>
                        <td colspan="3">
                            <input type="text" size="13"><span class="label-inline">State:</span><input type="text" size="3"><span class="label-inline">Zip:</span><input type="text" size="8">
                        </td>
                    </tr>
                    <tr>
                        <td class="label">Country:</td>
                        <td colspan="3"><input type="text" value="United States" size="13"></td>
                    </tr>
                    <tr>
                        <td colspan="4"><hr class="ke"></td>
                    </tr>
                    <tr>
                        <td class="label">Product:</td>
                        <td colspan="3">
                            <select style="width: 90px;">
                                <option>ScanMaster</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="label">Date Purchased:</td>
                        <td colspan="3"><input type="text" size="13"></td>
                    </tr>
                    <tr>
                        <td class="label">Serial #:</td>
                        <td colspan="3"><input type="text" size="13"></td>
                    </tr>
                    <tr>
                        <td class="label" valign="top">Used for:</td>
                        <td colspan="3">
                            <table border="0" cellpadding="0" cellspacing="0" class="radio">
                                <tr>
                                    <td width="120"><label><input type="radio" name="used"> Home</label></td>
                                    <td><label><input type="radio" name="used"> Educational Institution</label></td>
                                </tr>
                                <tr>
                                    <td><label><input type="radio" name="used" checked> Business</label></td>
                                    <td><label><input type="radio" name="used"> Other</label></td>
                                </tr>
                                <tr>
                                    <td colspan="2"><label><input type="radio" name="used"> Government</label></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td class="label" valign="top">System (check all that apply):</td>
                        <td colspan="3">
                            <table border="0" cellpadding="0" cellspacing="0" class="inner-table">
                                <tr>
                                    <td width="120"><label><input type="checkbox"> Windows</label></td>
                                    <td><label><input type="checkbox"> UNIX</label></td>
                                </tr>
                                <tr>
                                    <td><label><input type="checkbox"> Macintosh</label></td>
                                    <td><label><input type="checkbox"> Other</label></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4"><hr class="ke"></td>
                    </tr>
                    <tr>
                        <td class="label" valign="top">Comments?:</td>
                        <td colspan="3">
                            <input type="text" style="width: 300px; height: 90px;">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" align="center" class="nut">
                            <br>
                            <input type="submit" value="Click to register">
                            <input type="reset" value="Click to cancel">
                        </td>
                    </tr>
                </table>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
